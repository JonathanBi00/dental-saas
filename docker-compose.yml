name: dental-saas

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432" # 5432 is often taken by a local Postgres install
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dental"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Throwaway Postgres for `task test`. Data lives in memory and is lost on restart; each
  # test package creates its own database here and drops it when done.
  postgres-test:
    image: postgres:17-alpine
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dental"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for documents and imaging (used from Phase 6).
  # MinIO no longer publishes public images, so we use SeaweedFS's S3 gateway.
  objectstore:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # master UI/status
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  objectdata:
