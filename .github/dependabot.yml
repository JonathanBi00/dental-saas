version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly, day: monday, timezone: Australia/Sydney }
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, timezone: Australia/Sydney }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to 5.9 until openapi-typescript supports TypeScript 6 (see README).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Australia/Sydney }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly, timezone: Australia/Sydney }
